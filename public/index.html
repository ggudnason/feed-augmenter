<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed Augmenter</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Feed Augmenter</h1>
    <span id="dirty" class="dirty" hidden>Unsaved changes</span>
    <button id="save" class="primary" disabled>Save</button>
  </header>

  <div class="layout">
    <aside>
      <ul id="feed-list"></ul>
      <button id="add-feed">+ Add feed</button>
      <div id="server-info" class="muted small"></div>
    </aside>

    <main id="editor">
      <p class="muted">Select or add a feed.</p>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
